name: linkcheck
on:
  push:
    branches: [arena/78e1b843-estudoescolar]
    paths: [.github/workflows/linkcheck.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check game URLs
        run: |
          python3 - << 'PY'
          import json
          games=json.load(open('data/games.json'))
          urls={}
          for g in games:
              u=g.get('u','')
              if isinstance(u,str) and u.startswith('https://bikesense.org'):
                  urls[u]=g['id']
          with open('/tmp/urls.txt','w') as f:
              for u in urls: f.write(u+'\n')
          print(len(urls),'urls')
          PY
          cat > /tmp/check.sh << 'SH'
          #!/bin/bash
          u="$1"
          code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 12 --retry 0 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$u" 2>/dev/null)
          echo -e "$code\t$u"
          SH
          chmod +x /tmp/check.sh
          xargs -a /tmp/urls.txt -P 8 -I{} /tmp/check.sh {} > link-report2.tsv 2>/dev/null || true
          wc -l link-report.tsv; sort link-report.tsv | uniq -c | sort -rn | head -15
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add link-report2.tsv
          git commit -m "temp: relatório bikesense (via Actions)" || echo "nada"
          git push
