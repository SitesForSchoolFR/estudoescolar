name: fetch-bikesense
on:
  push:
    branches: [arena/a52a8ee4-estudoescolar]
    paths: [.github/workflows/fetch-bikesense.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download catalogs from bikesense.org
        run: |
          mkdir -p /tmp/bsdata
          curl -sL --retry 3 "https://bikesense.org/games/v1/providers/all" -o /tmp/bsdata/all.json
          curl -sL --retry 3 "https://bikesense.org/games/v1/providers/selenite" -o /tmp/bsdata/selenite.json
          curl -sL --retry 3 "https://bikesense.org/games/v1/providers/quasar" -o /tmp/bsdata/quasar.json
          curl -sL --retry 3 "https://bikesense.org/games/v1/providers/ckv" -o /tmp/bsdata/ckv.json
          curl -sL --retry 3 "https://bikesense.org/games/v1/providers/seraph" -o /tmp/bsdata/seraph.json
          curl -sL --retry 3 "https://bikesense.org/games/v1/providers/truffled" -o /tmp/bsdata/truffled.json
          curl -sL --retry 3 "https://bikesense.org/games/v1/providers/ugs" -o /tmp/bsdata/ugs.json
          curl -sL --retry 3 "https://bikesense.org/api/astra/games" -o /tmp/bsdata/astra.json || true
          ls -la /tmp/bsdata
          # split into <900KB parts so git stays happy, then commit to a data folder on this branch
          mkdir -p bs-raw
          python3 - << 'PY'
          import json, os
          for name in ["all","selenite","quasar","ckv","seraph","truffled","ugs","astra"]:
              p=f"/tmp/bsdata/{name}.json"
              try:
                  d=open(p,'rb').read()
                  json.loads(d)  # validate
                  open(f"bs-raw/{name}.json","wb").write(d)
                  print(name, len(d))
              except Exception as e:
                  print(name, "SKIP", e)
          PY
      - name: Commit catalogs to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bs-raw/
          git commit -m "temp: catálogo bruto bikesense (via Actions)" || echo "nothing to commit"
          git push
